name: Deploy site

# 只发布 site/ 这一份构建产物，不跑采集：
# 采集依赖本机定时任务，Apple 也没有历史榜单接口，CI 里抓不到仓库这份快照。
# 因此在线页面是「最近一次本机构建」的快照，不是实时榜单。

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 上传与部署拆成两个 job：deploy-pages 靠 listArtifacts() 查产物，
  # 同一 job 内上传完立刻查会有竞态（actions/deploy-pages#451），
  # 产物刚 finalize 不到 1 秒时查找会返回 0 个而误判失败。
  # 拆开后 deploy 在 build 结束后才启动，查找发生在数秒之后。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 检查三页齐全
        run: |
          for f in index.html yesterday.html weekly.html; do
            test -s "site/$f" || { echo "缺少 site/$f"; exit 1; }
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
